name: Portfolio Web and API
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Run web tests with repository secrets
        run: npm run test:web:ci
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          WEB_USERNAME: ${{ secrets.WEB_USERNAME }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          WEB_EMAIL: ${{ secrets.WEB_EMAIL }}
      - run: npm run test:api
        if: ${{ !cancelled() }}
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: portfolio-results
          path: |
            portfolio-report/
            portfolio-results/
            allure-results/
            allure-report/
